[tool.pytest.ini_options]
pythonpath = ["."]
addopts = [
    "--cov=.",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_empty = true

[project]
name = "portfolio-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PyJWT[crypto]==2.13.0",
    "fastapi==0.136.3",
    "uvicorn[standard]==0.48.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "python-multipart",
    "pydantic==2.13.4",
    "psycopg2-binary==2.9.12",
    "supabase==2.30.1",
    "pillow==12.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]
