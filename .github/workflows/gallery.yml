name: Gallery Build

on:
  push:
    branches: [main, feature/**]
    paths:
      - "apps/gallery/**"
      - "packages/shared-types/**"
      - ".github/workflows/gallery.yml"
  pull_request:
    paths:
      - "apps/gallery/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/gallery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
        working-directory: .
      - run: npm run build -w apps/gallery
