name: Python Lint and API Tests

on:
  push:
    branches: [main, feature/image-hosting-python]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff httpx

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v
